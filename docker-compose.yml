version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: clockwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: api
    environment:
      DATABASE_URL: postgres://postgres:devpass@postgres:5432/clockwork?sslmode=disable
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: worker
    environment:
      DATABASE_URL: postgres://postgres:devpass@postgres:5432/clockwork?sslmode=disable
      NUM_WORKERS: "4"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2 
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: scheduler
    environment:
      DATABASE_URL: postgres://postgres:devpass@postgres:5432/clockwork?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
volumes:
  pgdata: